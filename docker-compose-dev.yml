services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./secrets/dev.env
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mynotes-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    env_file:
      - ./secrets/dev.env
    depends_on:
      - db
    environment:
      - BACKEND_CORS_ORIGINS=http://localhost:5173

volumes:
  dev-db-data: